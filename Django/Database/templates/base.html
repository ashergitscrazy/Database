<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Mabel Kay Sign-In
      {% endblock %}
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"  />
    <link rel="stylesheet" href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.13.2/themes/smoothness/jquery-ui.css" />
    <style>


      .header {
        color:#870202;
        font-size: 500%;
        font-family: Lobster;
        text-align:center;
        margin-top: 100px;
      }

      input {
        font-family: "Open Sans";
        color: #D07567;
      }

      .welcome {
      font-family: "Open Sans";
        border: 0.5px solid #870202;
        border-radius: 30px;
        width: 650px;
        margin-top: 100px;
      }

      .welcome h1,
      .welcome h2 {
        background-color: #870202;
        width: 100%;
        color: #f6f6f6;
        text-align: center;
        font-size: 5em;
        margin: 0;
        border: 0px;
      }

      .welcome h1 {
        border-top-left-radius: 30px;
        border-top-right-radius: 30px;
        letter-spacing: 0.5rem;
        font-weight: 800;
      }

      .welcome h2 {
        font-size: 3em;
        margin-top: -1px;
        padding-bottom: 8px;
      }

      .goodbye {
        margin-top: 100px;
        width: 100%;
      }

      .goodbye h1, .goodbye h2 {
        font-size: 3rem;
        text-align: center;
        font-family: "Open Sans";
        font-weight: 800;
        color: #870202;
        margin-top: 25px;
      }

      .goodbye h1 {
        font-family: Lobster;
        font-weight: 400;
      }

      .ui-widget {
        font-family:"Open Sans";
        font-size: 3rem;
        color: #040404;
        font-weight: 400;
      }
      .search {
        font-weight: 400;
        font-family:"Open Sans";
        width: 90%;
        margin: 1rem;
        font-size: 3rem;
        padding: 1rem;
        color: #040404;
        outline: none;
        margin-left: 5%;
        border: 1px solid #eee;
      }

      .welcome .bar {
        border-bottom-left-radius: 30px;
        border-bottom-right-radius: 30px;
        background-color: #870202;
        width: 100%;
        height: 30px;
      }

      .greeting {
        margin-top: 75px;
        text-align: center;
        margin-bottom: 50px;
      }

      .greeting h2,
      .greeting h3 {
        color: #040404;
        font-size: 3rem;
        font-family: "Open Sans";
      }

      .greeting h2 {
        font-weight: 800;
      }

      .btn.class-btn {
        width: 500px;
        padding: 15px;
        border: 2px solid #eee;
        background-color: #f6f6f6;
        transition-property: all;
        transition-duration: 0.4s;
      }

      .btn.class-btn:hover {
        border: 2px solid #ccc;
        background-color: #e6e6e6;
      }

      .class-btn.selected {
        border-color: #a1c1e3;
        background-color: #fff;
      }

      .class-list-container {
        width: 500px;
      }

      .class-list h2 {
        font-family: "Open Sans";
        font-weight: 800;
      }

      .class-list h4 {
        font-weight: 200;
      }

      .centered {
        position: relative;
        left: 50%;
        transform: translate(-50%, 0%);
        color: white;
      }

      .sign-me-in {
        position: relative;
        color: white;
        width: 150px;
      }

      .sign-in-btn {
        margin-top: 25px;
        width: 150px;
      }

      .start-over {
        position: relative;
        color: white;
        margin-top: 25px;
      }

      .class-list,
      .greeting,
      .sign-in-btn,
      .welcome,
      .cancel-btn {
        display:none;
        opacity: 0;
        transition-property: opacity;
        transition-duration: 1.5s;
      }

      .class-list button {
        margin-bottom: 1rem;
      }

      .class-list.active,
      .greeting.active,
      .sign-in-btn.active,
      .welcome.active,
      .cancel-btn.active {
        display: block;
        opacity: 100%;
      }



    </style>
  </head>
  <body>
    <div>
      {% block content %} {% endblock %}
    </div>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <!--script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js" ></script-->
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js" integrity="sha256-lSjKY0/srUM9BE3dPm+c4fBo1dky2v27Gdjm2uoZaL0=" crossorigin="anonymous"></script>


  </body>
</html>
